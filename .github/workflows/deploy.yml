name: Deploy

# Manual on-demand deploy: runs unit + integration + client tests, enforces the
# SonarCloud quality gate, and only on success builds+pushes both the API and
# client Docker images to GHCR and restarts web/web-client on the VPS. See the
# reusable workflow (dimasdom/SpreadScanner/.github/workflows/deploy-service.yml)
# for the full job graph and scripts/deploy-remote.sh for the VPS-side restart
# logic. web-client also needs the repo-root nginx/ directory (see CLAUDE.md).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run tests/build/push but skip the VPS deploy step"
        type: boolean
        default: false

jobs:
  deploy:
    permissions:
      contents: read
      packages: write
    uses: dimasdom/SpreadScanner/.github/workflows/deploy-service.yml@6ab25c064994ffdef9b21cb2ce69569cf6869727 # master
    with:
      self_checkout_path: ArbiScannerWebApp
      sonar_project_key: dimasdom_ArbiSpreadScanner.WebApp
      solution_file: ArbiScannerWebApp.sln
      unit_test_project: ArbiScannerWeb.Tests/ArbiScannerWeb.Tests.csproj
      integration_test_project: ArbiScannerWeb.IntegrationTests/ArbiScannerWeb.IntegrationTests.csproj
      has_client_tests: true
      client_dir: ArbiScannerWebApp/ArbiScannerWeb.Client
      sonar_begin_extra_args: >-
        /d:sonar.exclusions="**/Program.cs,**/ArbiScannerWeb.Domain/Models/**,**/ArbiScannerWeb.Infrastructure/Settings/**,**/ArbiScannerWeb.Infrastructure/DbContext/**,**/ArbiScannerWeb.Infrastructure/Migrations/**,**/ArbiScannerWeb.Abstractions/Interfaces/**,**/ArbiScannerWeb.Client/src/types/**,**/ArbiScannerWeb.Client/coverage/lcov-report/**"
        /d:sonar.coverage.exclusions="**/ArbiScannerWeb.Client/src/test/**,**/ArbiScannerWeb.Client/src/main.tsx,**/ArbiScannerWeb.Client/*.config.ts,**/ArbiScannerWeb.Client/src/**/*.test.ts,**/ArbiScannerWeb.Client/src/**/*.test.tsx"
        /d:sonar.javascript.lcov.reportPaths="${{ github.workspace }}/ArbiScannerWebApp/ArbiScannerWeb.Client/coverage/lcov.info"
        /d:sonar.typescript.lcov.reportPaths="${{ github.workspace }}/ArbiScannerWebApp/ArbiScannerWeb.Client/coverage/lcov.info"
        /d:sonar.verbose=true
      sibling_repos: "[]"
      images: >-
        [{"name":"arbiscanner-web","dockerfile":"ArbiScannerWebApp/Dockerfile","context":".","needs_root_checkout":false,"build_args":""},
         {"name":"arbiscanner-web-client","dockerfile":"ArbiScannerWebApp/Dockerfile.client","context":".","needs_root_checkout":true,"build_args":"VITE_API_URL="}]
      deploy_services: "web web-client"
      image_tag_vars: '{"web":"WEB_IMAGE_TAG","web-client":"WEB_CLIENT_IMAGE_TAG"}'
      dry_run: ${{ inputs.dry_run }}
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
