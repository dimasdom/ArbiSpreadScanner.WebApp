version: "3.8"

services:
  # ── Infrastructure ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: arbiscanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ArbiScannerBot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: REDACTED
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  kafka:
    image: apache/kafka:3.9.1
    container_name: arbiscanner-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - backend

  # One-shot topic creation (the monorepo root compose has the full, parameterised version in kafka/init-topics.sh).
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: arbiscanner-kafka-init
    restart: "no"
    entrypoint: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic spreads --partitions 12 --replication-factor 1 && /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic spreads.dlq --partitions 1 --replication-factor 1"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: arbiscanner-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - backend

  # ── Application ─────────────────────────────────────────────────────────────
  web:
    # Build with Projects/ parent as context so ArbiScannerAdminPannel is reachable.
    # Run from the Projects parent directory:
    #   docker compose -f ArbiScannerWebApp/docker-compose.yml up --build
    build:
      context: ../
      dockerfile: ArbiScannerWebApp/Dockerfile
    image: arbiscanner-web:latest
    container_name: arbiscanner-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SqlServer: "Host=postgres;Port=5432;Database=ArbiScannerBot;Username=postgres;Password=REDACTED"
      Messaging__ServiceName: webapp
      Kafka__BootstrapServers: kafka:9092
      Redis__Endpoint: redis:6379
      # Allow requests proxied by the client nginx container
      Cors__AllowedOrigins__0: http://localhost:3001
      # Override Loki URI so logs reach the monitoring stack
      Serilog__WriteTo__1__Args__uri: http://loki:3100
    depends_on:
      postgres:
        condition: service_started
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      loki:
        condition: service_started
    networks:
      - backend
      - monitoring

  client:
    build:
      context: ./ArbiScannerWeb.Client
      dockerfile: Dockerfile
    image: arbiscanner-client:latest
    container_name: arbiscanner-client
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - web
    networks:
      - backend

  # ── Monitoring ──────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:3.4.2
    container_name: arbiscanner-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.6.1
    container_name: arbiscanner-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - monitoring

volumes:
  postgres-data:
  loki-data:
  grafana-data:

networks:
  backend:
    driver: bridge
  monitoring:
    driver: bridge
