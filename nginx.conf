server {
    listen 80;
    server_name www.arbiscannerwebapp.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name www.arbiscannerwebapp.site;

    ssl_certificate     /etc/letsencrypt/live/www.arbiscannerwebapp.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.arbiscannerwebapp.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST API calls to the backend container
    location /api/ {
        proxy_pass         http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cookie_domain web www.arbiscannerwebapp.site;
        proxy_cookie_path   /  /;
    }

    # Proxy SignalR WebSocket hub
    location /hubs/ {
        proxy_pass         http://web:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # SPA fallback — serve index.html for all unmatched routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
